name: tests
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python scripts/check_consistency.py
      - run: python -m unittest discover -s tests -v

  release-files:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build choosewell.zip and attach it and the guide to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/package.py dist
          gh release upload "${{ github.event.release.tag_name }}" dist/choosewell.zip assets/choosewell-guide.docx --clobber
